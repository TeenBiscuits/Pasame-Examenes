<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Template solution checklist</title>
  <desc id="description">A solution checklist with four completed steps and a score badge.</desc>
  <rect width="960" height="540" rx="28" fill="#fff7ed"/>
  <rect x="34" y="34" width="892" height="472" rx="22" fill="#ffffff" stroke="#fed7aa" stroke-width="4"/>
  <circle cx="810" cy="132" r="70" fill="#0f766e"/>
  <text x="810" y="125" fill="#ccfbf1" font-family="sans-serif" font-size="18" text-anchor="middle">SCORE</text>
  <text x="810" y="153" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle">4 / 4</text>
  <text x="82" y="112" fill="#9a3412" font-family="sans-serif" font-size="30" font-weight="700">Model solution</text>
  <text x="82" y="145" fill="#c2410c" font-family="sans-serif" font-size="16">A second fixture image for explanation panels.</text>
  <g font-family="sans-serif" font-size="19">
    <circle cx="112" cy="225" r="22" fill="#16a34a"/>
    <path d="m101 225 8 8 15-17" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>
    <text x="158" y="232" fill="#431407">Identify the inputs</text>
    <circle cx="112" cy="295" r="22" fill="#16a34a"/>
    <path d="m101 295 8 8 15-17" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>
    <text x="158" y="302" fill="#431407">Apply the transformation</text>
    <circle cx="112" cy="365" r="22" fill="#16a34a"/>
    <path d="m101 365 8 8 15-17" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>
    <text x="158" y="372" fill="#431407">Check the intermediate result</text>
    <circle cx="112" cy="435" r="22" fill="#16a34a"/>
    <path d="m101 435 8 8 15-17" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>
    <text x="158" y="442" fill="#431407">State the final answer</text>
  </g>
  <path d="M690 260c38-44 86-42 120-8" fill="none" stroke="#fb923c" stroke-linecap="round" stroke-width="8"/>
  <path d="m806 234 12 18-22 2" fill="#fb923c"/>
</svg>
