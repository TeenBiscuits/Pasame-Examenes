<!doctype html>
<html lang="es" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Pásame Exámenes</title>
    <meta
      id="meta-description"
      name="description"
      content="Practica preguntas de exámenes de la FIC con respuestas modelo y autocorrección."
    />
    <meta id="meta-robots" name="robots" content="noindex, nofollow" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png?v=20260620"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260620" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260620" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=20260620"
    />
    <meta name="apple-mobile-web-app-title" content="Pásame Exámenes" />
    <link rel="manifest" href="/site.webmanifest?v=20260620" />
    <meta id="theme-color" name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var stored;
        try {
          stored = localStorage.getItem("theme");
        } catch (_) {
          stored = null;
        }
        var theme =
          stored === "light" ||
          stored === "dark" ||
          stored === "system" ||
          stored === "princess" ||
          stored === "latte" ||
          stored === "frappe" ||
          stored === "macchiato" ||
          stored === "mocha"
            ? stored
            : "system";
        document.documentElement.setAttribute("data-theme", theme);

        var colors = {
          light: "#ffffff",
          dark: "#1f2937",
          princess: "#fefbfb",
          latte: "#dce0e8",
          frappe: "#232634",
          macchiato: "#181926",
          mocha: "#11111b",
        };
        var schemes = {
          light: "light",
          dark: "dark",
          princess: "light",
          latte: "light",
          frappe: "dark",
          macchiato: "dark",
          mocha: "dark",
        };
        var resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        var color = colors[resolved];
        document.documentElement.style.setProperty(
          "--browser-chrome-color",
          color,
        );
        var meta = document.getElementById("theme-color");
        if (meta) meta.setAttribute("content", color);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) {
          scheme.setAttribute(
            "content",
            theme === "system" ? "light dark" : schemes[theme],
          );
        }
      })();
    </script>

      src="https://analytics.ahrefs.com/analytics.js"

      async
    ></script>
